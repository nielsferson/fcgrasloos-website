name = "fcgrasloos-scores"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Create with: wrangler kv namespace create SCORES
# then paste the returned id below.
kv_namespaces = [
  { binding = "SCORES", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

[vars]
# Restrict CORS to your site's origin once deployed, e.g. "https://fcgrasloos.com"
ALLOWED_ORIGIN = "*"

# Secrets (never put these here — set them with `wrangler secret put <NAME>`):
#   ADMIN_USER
#   ADMIN_PASS
#   TOKEN_SECRET   (any long random string, used to sign login tokens)
